# =====================================================================
# TilkiAdisyon — Otomatik Oluşturulan Nginx Domain Yapılandırması
# Domain: adisyon.ornekdomain.com -> Yerel Port: 3001
# Kurulum:
#   sudo cp domain-configs/nginx-adisyon.conf /etc/nginx/sites-available/tilki-adisyon
#   sudo ln -s /etc/nginx/sites-available/tilki-adisyon /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d adisyon.ornekdomain.com
# =====================================================================

server {
    listen 80;
    server_name adisyon.ornekdomain.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
